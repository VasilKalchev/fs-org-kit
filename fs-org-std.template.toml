# =====================================================================
# fs-org-std - personal filesystem organization standard (template)
# =====================================================================
#
# This file is the SKELETON / GRAMMAR for fs-org-std.toml, a
# machine-enforceable standard for organizing everything under `root`.
# It is not meant to be populated and used directly - copy its shape
# into the real fs-org-std.toml, and validate that file against this
# grammar with validate_fs_org_std.py.
#
# Core concepts:
#   root      - the directory this whole standard governs.
#   paths     - specific, individually documented locations, each keyed
#               by its path relative to `root` (e.g. "path/a/").
#   folders   - rules and definitions that apply without being tied to
#               one cataloged path: [[folders.rules]] apply to EVERY
#               folder under root (cataloged or not); [folders.reserved]
#               defines reserved folder-NAME patterns, independent of
#               location. Rules attached to a reserved entry run once
#               per folder actually carrying that name, anywhere under
#               root - see that section below.
#   rules     - REFERENCES to rule types, attached ("instantiated")
#               under a path, folder, or cross-path set via
#               [[<...>.rules.<name>]], where a fresh `reason` (and any
#               required params) must be supplied at that call site.
#               The rule types themselves are defined externally, one
#               per rules/<rule-name>-v<major>/rule.toml - see
#               rule.template.toml for that file's grammar, and
#               rules/rule-a-v1/ + rules/rule-b-v1/ for worked examples.
#               A rule's name always carries its major version
#               (e.g. "rule-a-v1"), since that's the compatibility unit:
#               a breaking change to a rule is a new directory, not an
#               edit to the old one.
#   enums     - closed value sets, one per field that has one, grouped by
#               the KIND of field they belong to (enums.group.<field>,
#               enums.doc.<field>) and shared by both namespaces.
#               (enums.severity and enums.scope, for rules specifically,
#               now live in rule.template.toml alongside what they
#               validate.)
#
# An entry under [paths."..."] or [folders.reserved."..."] is THREE
# TABLES, named for who reads them - and each namespace declares, once,
# what may go in the first two:
#
#   <entry>.doc    documentation. Free-form: a string, or a list of
#                  strings. Nothing reads the values; the doc generator
#                  renders whatever is there. Declared in <ns>.doc.names,
#                  with <ns>.doc.required naming the ones that may not be
#                  left empty.
#   <entry>.group  grouping. Enum-backed, checked against
#                  enums.group.<field>, and used to sort entries into
#                  buckets in the generated docs - a closed vocabulary is
#                  what makes that possible. Declared in <ns>.group.names;
#                  a field named in <ns>.group.multi holds a LIST of
#                  values (e.g. content that's partly self-authored and
#                  partly generated), every other one holds exactly one.
#   <entry>.rules  everything the rule machinery reads: the rule
#                  attachments, plus the CONTROL fields `allow_missing`
#                  and `outside_root` described below. Those two are the
#                  tool's own - a fixed set, never declared in either
#                  list, and a standard can't rename or invent one.
#
# The same three tables appear one level up, on the namespace itself:
# [paths.doc] / [paths.group] declare the fields, [paths.rules] holds the
# standard-wide control defaults and the blanket attachments.
#
# Which names appear in `doc` and `group` is entirely yours - nothing in
# the code knows what `purpose` or `lifecycle` mean. The two namespaces
# declare independently, so `folders` can carry a different set of fields
# from `paths`; the vocabularies under enums are shared between them,
# since a value set describes the field, not who carries it.
#
# <ns>.doc.defaults / <ns>.group.defaults apply wherever an entry sets a
# field neither itself nor by inheritance. Most fields have no sensible
# standard-wide default - nothing about a specific path's `purpose` is
# universal - so both are normally empty; `allow_missing` is the one
# field that ships with a real default, declared in [paths.rules] beside
# the field it defaults.
#
# `allow_missing` (bool, default false via [paths.rules]) -
# marks a cataloged path as one that may not currently exist on disk.
# Without it, a cataloged path the runner can't find on disk is reported
# as a problem. With it, that's expected - the runner skips it silently
# (no rules invoked for it) rather than treating its absence as an error.
# This is what makes state-via-location schemes (PARA-style archiving:
# a project moves from active/x/ to archive/x/ and back) not require
# editing this file on every move - catalog BOTH possible locations once,
# mark the ones that won't always exist, and moving the real folder on
# disk needs no standard edit at all.
#
# `outside_root` (bool, no default) - confirms that this entry's key
# deliberately names somewhere OUTSIDE root. Required on any key that
# escapes, by any of three routes: absolute ("/etc/nginx/"), home-relative
# ("~/.config/"), or walking up out of root ("../sibling/"). Without it,
# such a key is a validation error.
# It exists because the escape was previously silent and easy to do by
# accident - joining an absolute key onto root DISCARDS root entirely - so
# a stray leading slash would have quietly pointed rules at the wrong tree.
# Unlike every other field here, it is never inherited and never picks up a
# default from [paths.rules]; it has to be written on the entry
# that escapes. That's the same stance `reason` takes at rule attachment
# sites: a field whose whole job is to make one thing deliberate is worth
# nothing if it can arrive from somewhere else. The runner's sandbox also
# reads it - an out-of-root path is a place a fixer is allowed to write,
# and it can only know that if the standard says so.
# [[paths.cross]] carries the same flag in its own `rules` table, covering
# every path it lists.
#
# `inherit` (optional sub-table on a [paths."..."] or
# [folders.reserved."..."] entry) - lets one entry reuse another's
# tables instead of redeclaring them. One key per table, named for it:
#   [paths."archive/project-x/".inherit]
#   doc = "active/project-x/"          # full inherit, this entry's own
#                                       # explicit fields still override
#   group = "active/project-x/"        # same, per field
#   rules = "active/project-x/"        # inherited rules MERGE with this
#                                       # entry's own attachments (both
#                                       # apply) - use exclude_rules to
#                                       # drop specific inherited ones.
#                                       # Control fields come with it,
#                                       # overriding per field like above.
#   exclude_rules = ["rule-a-v2"]      # rule ids to drop from what
#                                       # `rules` would otherwise bring in
# The three may point at different source entries, or be omitted
# independently (e.g. inherit `doc` only, declare all rules
# fresh). Chains are allowed (C inherits from B inherits from A);
# cycles are a validation error. `exclude_rules` without `rules` set is
# a validation error - there's nothing to exclude from. To CHANGE an
# inherited rule's params rather than just drop it, exclude it and
# redeclare it fresh with the params you want - a same-named rule
# inherited AND separately declared on the same entry doesn't silently
# override, both instances apply.
# Inheritance is scoped to its own kind: a path can only inherit from
# another path, a reserved folder entry only from another reserved
# folder entry.
#
# A [paths."..."] key may be a GLOB PATTERN instead of one exact
# location - same vocabulary as `exclude` params elsewhere (fnmatch/
# pathlib.Path.glob: *, **, ?, [abc] - no brace-expansion, no stdlib
# support for it; [1-3] already covers a numeric range):
#   [paths."clients/*/".doc]
#   purpose = "A client's workspace"
#   [paths."clients/*/".group]
#   lifecycle = "ongoing"
#   origin = ["self"]
#   [[paths."clients/*/".rules.rule-a-v1]]
#   reason = "..."
# One entry, every real match sharing its fields/rules - invoked
# once per match, exactly like [[folders.rules]] invokes once per real
# folder on disk. A pattern matching zero real folders follows
# `allow_missing`, same as a literal path not existing - no separate
# concept. Two catalog keys that could match the same real folder is a
# validation error (checked statically, from the key strings alone, no
# filesystem access) UNLESS a literal entry explicitly opts in via
# inherit - the sanctioned way to override one instance:
#   [paths."clients/acme/".doc]
#   purpose = "Acme specifically"
#   [paths."clients/acme/".inherit]
#   doc = "clients/*/"
#   group = "clients/*/"
#   rules = "clients/*/"
# Without that inherit link, `clients/acme/` colliding with
# `clients/*/` is rejected, not silently resolved by precedence - see
# doc/DESIGN.md's "Path Pattern Keys" for the full rationale, including
# why two overlapping PATTERNS (no natural precedence between them)
# have no such override and are always an error.
#
# `instance_attributes` (must be supplied fresh at every attachment site,
# currently just `reason`) - never has a default; that's what distinguishes
# it from a rule's own attributes (purpose/severity/exclude/scope),
# which live in that rule's own manifest instead of here.
#
# Whether a rule can be fixed is determined structurally by the presence
# of the -fix.py script file, not by a manifest field. Omission is
# meaningful for `exclude` on a rule's own manifest - see rule.template.toml.
#
# Path keys: relative to `root`, with a trailing slash (e.g. "path/a/").
# A key that resolves OUTSIDE root - absolute ("/etc/nginx/"),
# home-relative ("~/.config/"), or walking up ("../sibling/") - is legal,
# but only on an entry that declares `outside_root = true`; see that field
# below.
#
# Value formats for rule params that take a duration or a size:
#   duration - <n><unit>, no space: 3d (days), 5w (weeks), 2m (months)
#   size     - <n><unit>, binary units: 500MiB, 10GiB, 1TiB
#
# Versioning: schema_version tracks this file's STRUCTURE (the
# grammar); standard_version tracks the CONTENT of the real standard.




root = "~/usr/"

[meta]
description = ""

schema_version = "2.0"     # version of this TOML *structure* (the grammar/spec)
schema_date = 2026-08-12

standard_version = "2.0"   # version of the *content* of the standard
standard_date = 2026-08-12




# ===================================================================
# Enums
# ===================================================================
[enums]
purpose = "Validate the specified values."

# One table per field with a closed value set, named enums.<kind>.<field>
# for the kind of field it belongs to. Vocabularies are shared by both
# namespaces: a value set describes the FIELD, so `paths` and `folders`
# grouping by `lifecycle` mean the same four values. There's no
# enums.rules - the control fields are the tool's, not yours.

# -------------------------------------------------------------------
# Enums > Group
# -------------------------------------------------------------------
# Required for every grouping field: one that has no table here still
# groups, but its values go unchecked (the validator warns).
[enums.group.lifecycle]
transient = "meant to be emptied constantly, nothing lingers"
temporary = "has a completion condition, then gets archived"
ongoing = "continuously active/maintained, no end state"
archival = "already at rest, rarely touched"

[enums.group.origin]
self = "authored directly by you - nothing to re-fetch or resync from elsewhere"
external = "sourced from outside this system - downloaded, received, or otherwise not authored by you"
generated = "produced automatically by a tool, script, or model - not hand-authored, not fetched externally"

# -------------------------------------------------------------------
# Enums > Doc
# -------------------------------------------------------------------
# Optional, and normally absent: a documentation field is prose. Declare
# a table here only for one whose values really are a closed set - it's
# then checked the same way a grouping field is, without becoming one.
#   [enums.doc.review_cycle]
#   annual = "..."
#   quarterly = "..."

# `exclude` is a native TOML array of glob strings and needs no enum table.
# (Whether a rule can be fixed is structural - it's the presence of the
# -fix.py script file - not manifest-declared.)


# ===================================================================
# Folders
# ===================================================================
[folders]
# Rules and definitions that apply without being tied to one cataloged path:
# blanket rules over every folder under root, and reserved folder-name patterns
# that apply independent of location.

# What a [folders.reserved."..."] entry may carry - the same two
# declarations as paths below, and deliberately a SMALLER set here: this
# namespace needs no `origin`, and gets no control fields at all (a
# reserved-name pattern isn't one location, so "does it exist on disk"
# and "does it point outside root" have nothing to apply to). `inherit`
# works identically here too - see the worked example under
# [paths."path/a/archived/"] below; the mechanism is namespace-scoped, so
# a reserved folder entry can only inherit from another reserved folder
# entry, never from a [paths."..."] entry.
[folders.doc]
names = ["purpose", "notes", "use_for", "not_for", "see_also"]
required = ["purpose"]

[folders.doc.defaults]

# enum-backed, checked against enums.group.<field>, used to group
# reserved folders in the generated docs
[folders.group]
names = ["lifecycle"]
required = ["lifecycle"]

[folders.group.defaults]

# rules applying to EVERY folder under root, cataloged or not - use this to
# catch folders that exist on disk but aren't part of the documented standard.
[[folders.rules.rule-a-v1]]
reason = "Why is this rule applied to all folders?"

[folders.rules.rule-a-v1.params]
key-a-1 = "custom value"


# -------------------------------------------------------------------
# Folders > Reserved
# -------------------------------------------------------------------
# `prefix` is the naming convention every reserved folder is expected to
# follow, wherever it appears in the tree - checked by the validator's
# own reserved-name-prefix lint, and available to rules (as a param,
# since scripts never see the parsed standard directly) that need to
# scan the real filesystem for prefix-matching folders, e.g. to find
# ones that exist on disk but were never cataloged here.
[folders.reserved]
prefix = "_"

[folders.reserved."_folder-name".doc]
purpose = "Example - describe what this specific reserved folder name means, wherever it appears in the tree."
notes = "E.g.: caveats..."
use_for = [
  "",
  ""
]
not_for = [
  "",
  ""
]

[folders.reserved."_folder-name".group]
lifecycle = ""

# Rules attach here exactly as they do on a path, but the target set is
# a NAME match: the runner invokes this once per folder actually called
# `_folder-name`, anywhere under root, none of which need to be
# cataloged as paths. That's the difference from [[folders.rules]]
# (every folder, once, from root) and from [paths."..."] (one location,
# or one glob's worth of them).
# A folder that is both a reserved name and its own [paths."..."] entry
# gets BOTH sets of rules - they answer different questions ("what
# _folder-name means anywhere" vs "what this one location is"), the same
# way a per-path attachment and [[folders.rules]] already coexist.
# A reserved name matching no folder on disk is not "missing" - nothing
# says it has to occur - which is why this namespace gets no
# `allow_missing` control field to set.
[[folders.reserved."_folder-name".rules.rule-a-v1]]
reason = "Why is this rule applied wherever this name appears?"

[folders.reserved."_folder-name".rules.rule-a-v1.params]
key-a-1 = "custom value"



# ===================================================================
# Paths
# ===================================================================
[paths]
# Specific, individually documented locations under root - each gets its own
# [paths."..."] entry describing what it's for, its lifecycle, and its origin.

# free-form documentation fields on a [paths."...".doc] table - a string
# or a list of strings each, rendered as-is by the doc generator. Most
# have no default since a path's own content is what's supposed to fill
# them in; whatever is declared under `defaults` applies wherever an
# entry sets that field neither itself nor by inheritance.
[paths.doc]
names = ["purpose", "notes", "use_for", "not_for", "see_also"]
required = ["purpose"]

[paths.doc.defaults]

# enum-backed fields, checked against enums.group.<field> and used to
# group paths in the generated docs. `origin` is listed in `multi` because
# content can be partly self-authored and partly generated; `lifecycle`
# holds exactly one value.
[paths.group]
names = ["lifecycle", "origin"]
multi = ["origin"]
required = ["lifecycle", "origin"]

[paths.group.defaults]

# Everything the rule machinery reads, for the whole namespace: the
# standard-wide default for each control field, then the rules applying
# to every *standardized* path (i.e. every path with its own
# [paths."..."] entry below) - not every folder under root. See
# [[folders.rules]] for that broader scope.
# TOML note: bare keys must come before any [paths.rules.<...>] sub-table,
# here and on every entry below - a table can't be reopened once a
# sub-table of it has been declared.
[paths.rules]
allow_missing = false
# `outside_root` deliberately has NO default here, and can't be given one:
# it must be written on each escaping entry itself (see below).

[[paths.rules.rule-a-v1]]
reason = "Why is this rule applied to all standardized paths?"


# -------------------------------------------------------------------
# Paths > path/a/
# -------------------------------------------------------------------
# Every entry is the same three tables: what it is (`doc`), how it sorts
# (`group`), and what the rule machinery does with it (`rules`).
[paths."path/a/".doc]
purpose = ""
notes = ""
use_for = [
  "",
  ""
]
not_for = [
  "",
  ""
]
see_also = ""

[paths."path/a/".group]
lifecycle = ""
origin = []

[[paths."path/a/".rules.rule-a-v1]]
reason = "Why is this rule applied to this path?"

[paths."path/a/".rules.rule-a-v1.params]
key-a-1 = "custom value"
# A param value can be {ref = "dotted.path"} instead of a literal -
# expanded by the runner/validator to the table's keys (or the list)
# found at that path elsewhere in this file, e.g.:
#   key-a-2 = { ref = "abbreviations" }         # -> [abbreviations]'s keys
#   key-a-3 = { ref = "folders.reserved" }      # -> [folders.reserved]'s entry names
# Use this instead of retyping a list that's already declared elsewhere
# in this file by hand - see fs_org_kit.param_refs and doc/DESIGN.md.


# -------------------------------------------------------------------
# Paths > path/b/
# -------------------------------------------------------------------
[paths."path/b/".doc]
purpose = ""
notes = ""
use_for = [
  "",
  ""
]
not_for = [
  "",
  ""
]
see_also = ""

[paths."path/b/".group]
lifecycle = ""
origin = []


# -------------------------------------------------------------------
# Paths > path/a/aa/
# -------------------------------------------------------------------
[paths."path/a/aa/".doc]
purpose = ""
notes = ""
use_for = [
  "",
  ""
]
not_for = [
  "",
  ""
]
see_also = ""

[paths."path/a/aa/".group]
lifecycle = ""
origin = []


# -------------------------------------------------------------------
# Paths > path/a/archived/ - worked example of `inherit`
# -------------------------------------------------------------------
# A location that only sometimes exists - e.g. path/a/ moved here when
# archived, and moved back when reactivated. Rather than edit this file
# on every move, both locations are cataloged once; whichever one isn't
# currently real on disk is simply skipped by the runner, because of
# allow_missing below.
[paths."path/a/archived/".group]
lifecycle = "archival"          # overrides path/a/'s inherited lifecycle

[paths."path/a/archived/".rules]
allow_missing = true            # this location may not currently exist

[paths."path/a/archived/".inherit]
doc = "path/a/"                  # purpose, notes, use_for, etc. - full
                                 # inherit, this entry's own explicit
                                 # fields above still win
group = "path/a/"                # same, for the grouping fields - so only
                                 # `lifecycle` above had to be restated
rules = "path/a/"                # inherited rule attachments MERGE with
                                 # any this entry declares itself
exclude_rules = ["rule-a-v1"]    # dropped from what `rules` brings in -
                                 # e.g. a staleness check that shouldn't
                                 # apply once something's archived


# -------------------------------------------------------------------
# Paths > Cross
# -------------------------------------------------------------------
[[paths.cross]]
paths = ["path/a/", "path/b/"]

# A cross entry has the same `rules` table as a path entry - control
# fields first, then the attachments. `outside_root` here covers every
# path the set lists.
[paths.cross.rules]

[[paths.cross.rules.rule-a-v1]]
reason = "Why is this rule applied to this set of paths?"

[paths.cross.rules.rule-a-v1.params]
key-a-1 = "custom value"


# ===================================================================
# Tags
# ===================================================================
[tags]




# ===================================================================
# Abbreviations
# ===================================================================
[abbreviations]
area = "Area of responsibility"
arch = "Archive"
app = "Application"
bkup = "Backup"
career = "Career information"
embd = "Embedded"
fin = "Finance"
fw = "Firmware"
inv = "Inventory"
item = "Individual owned item"
knwl = "Knowledge"
lib = "Library"
lnk = "Link"
lrn = "Learn"
med = "Medical"
ndx = "Index"
prj = "Project"
res = "Resource"
scr = "Script"
std = "Standard"
strg = "Storage"
