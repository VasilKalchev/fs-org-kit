<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="fs-org-kit">
  <title>fs-org-kit</title>
  <!-- Transparent background and mid-tone colours, so the mark reads on
       both a light and a dark page. Folder = amber, tree = slate,
       check = the same green the runner prints for ok/fixed. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- folder -->
    <path d="M8 12h12l3.5 5H52a3 3 0 0 1 3 3v33a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V15a3 3 0 0 1 3-3z"
          stroke="#d9a441" stroke-width="3.5"/>

    <!-- directory tree inside it -->
    <path d="M16 24v22" stroke="#8b949e" stroke-width="2.5"/>
    <path d="M16 28h6M16 36h6M16 46h6" stroke="#8b949e" stroke-width="2.5"/>
    <path d="M26 28h14M26 36h8" stroke="#8b949e" stroke-width="2.5"/>

    <!-- ...whose last leaf is a check -->
    <path d="M26 46.5l3.5 3.5L39 41" stroke="#3fb950" stroke-width="3.5"/>
  </g>
</svg>
