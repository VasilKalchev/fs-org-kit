version = "1.0"
purpose = "Reports links whose target no longer exists - symlinks, XDG .desktop entries, Windows .lnk/.url shortcuts, and macOS .webloc bookmarks."
severity = "warn"
scope = "single"
protocol_version = "1.0"

# WHAT COUNTS AS A LINK
#
# "Link" is not one thing. Every desktop platform grew its own, and a
# folder that has been carried across machines or restored from a backup
# usually holds more than one kind. `kinds` selects which are checked:
#
#   "symlink"   POSIX symbolic links. The only kind the filesystem itself
#               knows about, and the only one that can form a cycle.
#   "desktop"   freedesktop .desktop entries. Type=Link (URL= points at
#               the target) and Type=Application (Exec= names a program)
#               are both checked; Type=Directory has no target to break.
#   "shortcut"  Windows .lnk (binary shell link) and .url (INI-format
#               internet shortcut).
#   "webloc"    macOS .webloc bookmarks (a plist holding one URL).
#
# WHAT CAN ACTUALLY BE VERIFIED
#
# Only targets that name a local file: a symlink's target, a file:// URL,
# a .lnk's stored local path, a .desktop Exec= resolved against PATH.
#
# An http(s) target is never reported broken - counted, not judged. This
# rule could request the sandbox's `network` capability and fetch them;
# it deliberately doesn't:
#
#   - a verdict that depends on someone else's server isn't a fact about
#     your filesystem. Offline, every bookmark reports broken, and the
#     runner exits 1 exactly as it would for a real violation.
#   - an HTTP status is a poor proxy for "broken": 403 bot protection,
#     429 rate limiting, a soft-404 parking page returning 200, a login
#     wall, a host that rejects HEAD.
#   - 500 bookmarks means 500 round trips with timeouts, on a rule that
#     otherwise finishes in milliseconds - and it would announce to every
#     one of those sites that you still hold the bookmark, as a side
#     effect of a filesystem audit.
#
# Reachability wants its own rule, attachable to the one folder where
# that cost is acceptable, rather than a flag on this one.
#
# A .lnk written on Windows stores a path like C:\Users\... which means
# nothing on this machine. `foreign_links` decides what to do with a
# target that can't apply here: "skip" (the default - silence about
# something unknowable) or "report" (list them separately, for a tree
# you know should be self-contained).
#
# macOS Finder aliases are NOT supported. They store an opaque binary
# bookmark blob whose resolution is a Cocoa API call, not a path lookup,
# and a half-implementation that guessed would report confident nonsense.
# They're detected and counted as unverifiable rather than ignored, so
# the count in the message never quietly disagrees with what's on disk.
#
# CHAINS AND CYCLES
#
# `follow_chains` (default true) reports a symlink whose target is itself
# a link that dangles - the first hop resolves, so a naive existence
# check calls it fine while opening it still fails. A symlink cycle is
# always reported: it can't be traversed at all, and the OS says so.
#
# WHY THERE IS NO FIXER
#
# A broken link has no recoverable target by definition, so the only
# mechanical repair is deletion - which throws away the one record of
# what used to be there, and is exactly wrong when the target is on an
# unmounted drive rather than gone.

[params]
names = ["kinds", "recursive", "exclude", "foreign_links", "follow_chains"]

[params.defaults]
kinds = ["symlink", "desktop", "shortcut", "webloc"]
recursive = true
exclude = []
foreign_links = "skip"
follow_chains = true
