version = "1.0"
purpose = "Moves everything not excluded out of a path into a target location, which may carry the current date - e.g. sweeping a desktop into a dated inbox folder."
severity = "info"
scope = "single"
protocol_version = "1.0"

# THE SWEEP
#
# Some locations are supposed to be empty. A desktop, a downloads folder,
# a scanner's output directory: things land there, and the standard's
# claim about them isn't "these files are named correctly" but "nothing
# should still be sitting here." This rule states that, and its fixer
# carries it out.
#
#   [[paths."~/Desktop/".rules.collect-v1]]
#   reason = "the desktop is a staging area, not storage"
#
#   [paths."~/Desktop/".rules.collect-v1.params]
#   target = "~/inbox/%Y-%m-%d-desktop-dump/"
#   keep = ["*.desktop"]      # launchers live here on purpose
#
# `target` is expanded with strftime, so the destination can be dated -
# %Y-%m-%d, %Y/%m, %Y-W%V, whatever grouping suits. {name} expands to the
# swept folder's own basename, which is what makes one attachment usable
# on several paths via a glob key or a blanket attachment. A relative
# target is resolved against the swept path; `~` is expanded.
#
# WHAT MOVES
#
# By default: every entry in the path, top level only. `keep` (globs)
# holds things back; `move`, if non-empty, inverts the default so only
# matching entries go. `min_age` (3d, 2w, 1m) leaves recent arrivals
# alone, which is what makes a sweep safe to run daily on a folder still
# being used.
#
# `recursive = true` sweeps files out of subfolders individually,
# flattening them into the target. It's off by default because moving a
# folder whole is nearly always what's meant, and flattening silently
# collides names that were previously kept apart by their folders.
#
# CONFLICTS
#
# `on_conflict`: "rename" (default - appends -2, -3, ...), "skip" (leave
# it, report it), or "fail" (stop and report unfixable). Nothing is ever
# overwritten under any setting: this rule moves things it was told are
# unimportant enough to sweep, which is exactly when silently destroying
# the older copy would go unnoticed.
#
# The target is never swept into itself, even when it sits inside the
# path being swept.
#
# [sandbox] unrestricted_writes
#
# The destination comes from `target` in the standard, so the core cannot
# know it in advance - it isn't root, and it isn't the path being swept.
# Every other write this rule makes is inside its own target. The sweep
# is still bounded by what the checker reported; the capability widens
# where the fixer may write, not what it decides to move.

[sandbox]
unrestricted_writes = true

[params]
names = ["target", "keep", "move", "recursive", "on_conflict", "min_age", "create_target"]

[params.defaults]
keep = []
move = []
recursive = false
on_conflict = "rename"
min_age = ""
create_target = true
# `target` has NO default - a sweep with a guessed destination is the one
# mistake here that can't be undone by re-running the rule.
