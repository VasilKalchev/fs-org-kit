# =====================================================================
# fs-org-std - a PARA tree, made machine-enforceable
# =====================================================================
#
# A small, complete, working standard for the toy filesystem in ./tree/.
# Read README.md next to this file for the guided tour; read
# ../../fs-org-std.template.toml for the full grammar (this file uses a
# deliberately small slice of it).
#
# `root` is RELATIVE, so it resolves against the directory you run the
# commands FROM, not against this file. Run everything from
# examples/para/.

root = "./tree/"

[meta]
description = "PARA (Projects / Areas / Resources / Archive) plus an inbox, as an enforceable standard."

schema_version = "2.1"     # grammar version - matches fs-org-std.template.toml
schema_date = 2026-08-12

standard_version = "2.1"   # version of the content below
standard_date = 2026-08-12


# ===================================================================
# Paths
# ===================================================================
# Every entry below is the same shape: its own documentation fields (what
# it is, in prose), a `group` table (how it sorts, from a closed
# vocabulary), and a `rules` table (which rules apply to it). This
# section declares what may go in the first two.
[paths]

# Free-form: whatever this standard wants to say about a path, rendered
# as written.
[paths.attributes]
names = ["purpose", "notes", "use_for", "not_for", "see_also"]
required = ["purpose"]

# Enum-backed, checked against enums.group.* below and used to group
# paths in the generated docs.
[paths.attributes.group]
names = ["lifecycle", "origin"]
multi = ["origin"]
required = ["lifecycle", "origin"]


# -------------------------------------------------------------------
# Paths > archive/
# -------------------------------------------------------------------
[paths."archive/"]
purpose = "Everything from the other three categories that is no longer active - kept, not deleted."
use_for = ["finished or abandoned projects", "areas you no longer maintain"]
not_for = ["anything you still expect to touch this month"]

[paths."archive/".group]
lifecycle = "archival"
origin = ["self"]


# -------------------------------------------------------------------
# Paths > archive/*/ - one archived project (worked `inherit` example)
# -------------------------------------------------------------------
# An archived project is still a project, just at rest: it keeps the
# same purpose and the same rules as an active one, and only its
# lifecycle changes. Rather than restate any of that, this entry
# inherits it - so a project moving between projects/ and archive/ (by
# hand, or by this standard's own fixer) needs no edit to this file.
[paths."archive/*/".group]
lifecycle = "archival"                 # the one thing that differs

[paths."archive/*/".inherit]
attributes = "projects/*/"                    # purpose, use_for, not_for...
group = "projects/*/"                  # ...origin, with lifecycle above winning
rules = "projects/*/"                  # ...and the README requirement


# -------------------------------------------------------------------
# Paths > areas/
# -------------------------------------------------------------------
[paths."areas/"]
purpose = "Ongoing responsibilities with a standard to maintain and no finish line - health, finances, the car."
notes = "The PARA distinction that does the most work: an area is never 'done'. If it can be finished, it belongs in projects/."
use_for = ["a responsibility you hold indefinitely"]
not_for = ["anything with a deadline or a definition of done"]

[paths."areas/".group]
lifecycle = "ongoing"
origin = ["self"]


# -------------------------------------------------------------------
# Paths > inbox/
# -------------------------------------------------------------------
[paths."inbox/"]
purpose = "Landing zone for anything not yet filed - scans, downloads, half-written notes."
notes = "Not part of canonical PARA, but a common addition: without it, filing pressure lands on the four real categories."
use_for = ["anything you haven't decided about yet"]
not_for = ["anything you've already decided about"]

[paths."inbox/".group]
lifecycle = "transient"
origin = ["external", "self"]

# An interrupted download or a failed export leaves a zero-byte file
# behind that looks like real content in a file listing. Folders are
# left alone here - an empty folder in an inbox is just an inbox.
[[paths."inbox/".rules.empty-v1]]
reason = "a zero-byte file in the inbox is a failed download, not something waiting to be filed"

[paths."inbox/".rules.empty-v1.params]
check_folders = false


# -------------------------------------------------------------------
# Paths > projects/
# -------------------------------------------------------------------
[paths."projects/"]
purpose = "Short-term efforts with a definition of done and (usually) a deadline."
use_for = ["anything you can finish"]
not_for = ["standing responsibilities - those are areas/", "reference material - that's resources/"]

[paths."projects/".group]
lifecycle = "temporary"
origin = ["self"]

# The core PARA dynamic, enforced: a project that has gone quiet has
# stopped being a project. `destination` is relative to the scanned
# path's parent, so it lands in tree/archive/. This rule ships a fixer,
# so `fs-org-run --fix` performs the move.
[[paths."projects/".rules.staleness-v1]]
reason = "a project nobody has touched in three months is finished or abandoned - either way it belongs in archive/"

[paths."projects/".rules.staleness-v1.params]
mode = "stale"
threshold = "90d"
destination = "archive"


# -------------------------------------------------------------------
# Paths > projects/*/ - every individual project folder
# -------------------------------------------------------------------
# A GLOB KEY: one entry, applied to every real folder it matches. Add a
# project on disk and it is covered with no edit here.
[paths."projects/*/"]
purpose = "One project: its notes, its files, and a README stating what 'done' means."
use_for = ["working files for this project only"]
not_for = ["reference material that outlives the project - move it to resources/ when you finish"]

[paths."projects/*/".group]
lifecycle = "temporary"
origin = ["self"]

[[paths."projects/*/".rules.required-content-v1]]
reason = "a project without a written definition of done drifts into being an area"

[paths."projects/*/".rules.required-content-v1.params]
required = ["README.md"]


# -------------------------------------------------------------------
# Paths > resources/
# -------------------------------------------------------------------
[paths."resources/"]
purpose = "Topics of ongoing interest - reference material that belongs to no single project."
use_for = ["notes, clippings and references you'll want again"]
not_for = ["anything you're actively working on"]

[paths."resources/".group]
lifecycle = "ongoing"
origin = ["self", "external"]

# Resources accumulate from everywhere - downloads, screenshots, exports
# - and arrive with whatever name the source gave them. One convention
# for both files and folders keeps the pile searchable.
[[paths."resources/".rules.naming-pattern-v1]]
reason = "reference material is only findable if it is named for what it contains"

[paths."resources/".rules.naming-pattern-v1.params]
pattern = '^[a-z0-9]+(-[a-z0-9]+)*(\.[a-z0-9]+)?$'   # kebab-case, optional extension
mode = "allow"
exclude = ["_*", "*/_*"]    # reserved folders have their own rules, below


# -------------------------------------------------------------------
# Paths > Cross - one rule, several paths at once
# -------------------------------------------------------------------
# Everything above asks a question about ONE location. This asks one
# about the relationship BETWEEN two: filing something means moving it,
# and a copy left behind in the inbox is the one that gets edited by
# mistake. Neither path can answer that alone - a duplicate is only
# visible from both at once.
[[paths.cross]]
paths = ["inbox/", "resources/"]

[[paths.cross.rules.duplicate-files-v1]]
reason = "a file that is in the inbox and already filed is a filing job that stopped halfway"

[paths.cross.rules.duplicate-files-v1.params]
cache = false   # this rule caches hashes between runs by default; off here
                # so the example leaves nothing behind outside its own directory


# ===================================================================
# Folders
# ===================================================================
# Everything that is NOT tied to one cataloged location: blanket rules
# over every folder under root, and reserved folder-NAME patterns that
# mean the same thing wherever they turn up.
[folders]

# A reserved folder entry documents itself the same way a path does,
# minus `origin` - a name means the same thing wherever it appears, so
# where its contents came from isn't a property of the name.
[folders.attributes]
names = ["purpose", "notes", "use_for", "not_for"]
required = ["purpose"]

[folders.attributes.group]
names = ["lifecycle"]
required = ["lifecycle"]

# -------------------------------------------------------------------
# Folders > blanket rules
# -------------------------------------------------------------------
# Covers every folder under root, cataloged or not - which is the point:
# the folder you made in a file manager at 11pm and never cataloged is
# exactly the one that breaks the convention.
#
# This is ONE invocation, handed root. How far it reaches is the rule's
# own business, so `recursive = true` is what makes it reach at all -
# a blanket attachment isn't a loop the runner performs for you.
#
# The leading `_?` admits reserved names like `_attachments` below;
# without it this convention would forbid the thing the next section
# defines.
[[folders.rules.naming-pattern-v1]]
reason = "a folder is found by its name long before anything looks inside it"

[folders.rules.naming-pattern-v1.params]
pattern = '^_?[a-z0-9]+(-[a-z0-9]+)*$'
mode = "allow"
target = "folders"
recursive = true


# -------------------------------------------------------------------
# Folders > Reserved
# -------------------------------------------------------------------
# `prefix` is the convention every reserved name follows, so a folder
# that looks reserved but was never documented here can be spotted.
[folders.reserved]
prefix = "_"

# Attached rules here match by NAME, not location: the runner invokes
# them once per folder actually called `_attachments`, anywhere under
# root. Neither of the two in this tree is cataloged as a path, and
# neither needs to be.
[folders.reserved."_attachments"]
purpose = "Files a document refers to, kept beside it rather than in a shared pile."
notes = "Deliberately location-independent: a note and the things it points at should move together, whichever of the four categories the note is sitting in this month."
use_for = ["images, scans and PDFs referenced by a document next to this folder"]
not_for = ["anything a second document also refers to - that's a resource, not an attachment"]

[folders.reserved."_attachments".group]
lifecycle = "ongoing"

# Attachments belong to the document beside them. The moment one grows
# subfolders it has become a project's working directory wearing the
# wrong name.
[[folders.reserved."_attachments".rules.link-policy-v1]]
reason = "an attachments folder that has grown subfolders has stopped being an attachments folder"

[folders.reserved."_attachments".rules.link-policy-v1.params]
folders = "forbidden"


# ===================================================================
# Enums
# ===================================================================
# Closed value sets, one per field that has one, named for the KIND of
# field rather than the namespace - `paths` and `folders` share them.
[enums]

[enums.group.lifecycle]
transient = "meant to be emptied constantly, nothing lingers"
temporary = "has a completion condition, then gets archived"
ongoing = "continuously active/maintained, no end state"
archival = "already at rest, rarely touched"

[enums.group.origin]
self = "authored directly by you - nothing to re-fetch or resync from elsewhere"
external = "sourced from outside this system - downloaded, received, or otherwise not authored by you"
generated = "produced automatically by a tool, script, or model - not hand-authored, not fetched externally"
