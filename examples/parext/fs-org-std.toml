[paths."media/vid/".group]
lifecycle = "ongoing"
origin = ["external"]

[paths."prj/"]
purpose = "Active projects."
notes = "A project is a transient effort which produces an outcome based on defined goals."
use_for = [
  "software/firmware projects",
  "PCB projects",
  "other multi-session efforts",
]
not_for = [
  "small tasks",
  "reusable resources",
]
see_also = ["task/", "prj/_arch/"]

[paths."prj/".group]
lifecycle = "temporary"
origin = ["self"]

[[paths."prj/".rules.staleness-v1]]
reason = "a project untouched for half a year is finished or abandoned; leaving it in prj/ hides the ones that aren't"

[paths."prj/".rules.staleness-v1.params]
mode = "stale"
threshold = "6m"
destination = "prj/_arch/%Y"
create_destination = true
exclude = ["_*", ".*"]


# --- prj/_arch/ ------------------------------------------------------
[paths."prj/_arch/"]
purpose = "Inactive projects."
notes = "Separated by year."
use_for = [
  "completed projects",
  "abandoned projects",
  "paused projects",
  "obsolete projects",
]
not_for = [
  "active projects",
  "backups",
]
see_also = ["prj/", "_arch"]

[paths."prj/_arch/".group]
lifecycle = "archival"
origin = ["self"]

[[paths."prj/_arch/".rules.naming-pattern-v1]]
reason = "the archive is only navigable while every folder at this level is a year"

[paths."prj/_arch/".rules.naming-pattern-v1.params]
pattern = '^[0-9]{4}$'
mode = "allow"
target = "folders"
recursive = false


