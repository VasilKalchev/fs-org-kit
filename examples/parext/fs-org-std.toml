# =====================================================================
#  fs-org-std - personal filesystem organization standard
# =====================================================================
#
# The machine-enforceable description of ~/usr/. This is a populated
# standard, not the grammar: for the full field reference see
# ../../fs-org-std.template.toml, and for a rule's params see that
# rule's own manifest under ../../rules/<rule-name>-v1/.
#
#   fs-org-validate fs-org-std.toml     # check this file
#   fs-org-run      fs-org-std.toml     # check the tree against it
#   fs-org-doc      fs-org-std.toml     # generate Markdown from it
#
# LAYOUT
#
#   area/    responsibilities held indefinitely, no finish line
#   inbox/   unclassified arrivals, continuously emptied
#   knwl/    distilled knowledge, self-written
#   media/   entertainment
#   prj/     multi-session efforts producing an outcome
#   res/     external reference material, mirrors knwl/
#   strg/    cold storage, rarely opened
#   sys/     files this machine consumes
#   task/    small efforts with a defined goal
#   tmp/     known-disposable files
#   ws/      reusable building blocks, shared across projects
#
# CONVENTIONS THIS FILE FOLLOWS
#
#   - path keys are relative to `root`, with a trailing slash, and the
#     catalog is kept alphabetical (the validator lints for both)
#   - `_`-prefixed folder names are reserved and mean the same thing
#     wherever they appear - see [folders.reserved]
#   - the accepted `lifecycle` and `origin` values are listed once, in
#     [enums], rather than repeated beside every entry
#   - every rule attachment carries its own `reason`; that is required,
#     never inherited, and is the only place the "why" is recorded


root = "~/usr/"

[meta]
description = "Personal filesystem standard for ~/usr/ - a PARA-style split (area/prj/task/res/knwl) with state carried by folder location and `_`-prefixed reserved names."

schema_version = "2.1"     # version of this TOML *structure* (the grammar/spec)
schema_date = 2026-08-12

standard_version = "2.1"   # version of the *content* of the standard
standard_date = 2026-08-12




# =====================================================================
#  GLOBS  -  shared lists, referenced from rule params
# =====================================================================
# A rule script never sees this file, only its own params - so a list
# needed by several attachments would otherwise be retyped at each one.
# `{ ref = "globs.<name>" }` expands to the list below instead (see
# fs_org_kit.param_refs).
[globs]

# Directories whose contents are owned by a tool, not by this standard.
# Every naming or spelling rule here would flag them forever, and none
# of it is anything to act on.
# fnmatch's `*` crosses `/`, so `*x` covers x at any depth and `*x/*`
# covers everything inside it.
tool_dirs = [
  "*.git", "*.git/*",
  "*.obsidian", "*.obsidian/*",
  "*.venv", "*.venv/*",
  "*__pycache__", "*__pycache__/*",
  "*node_modules", "*node_modules/*",
]




# =====================================================================
#  PATHS
# =====================================================================
[paths]

# Free-form documentation fields, written directly on each
# [paths."..."] entry below.
[paths.attributes]
names = ["purpose", "notes", "use_for", "not_for", "see_also"]
required = ["purpose"]

# Enum-backed fields, checked against enums.group.* and used to group
# paths in the generated docs.
[paths.attributes.group]
names = ["lifecycle", "origin"]
multi = ["origin"]
required = ["lifecycle", "origin"]


# ---------------------------------------------------------------------
#  area/  -  long-lived responsibilities and interests
# ---------------------------------------------------------------------
[paths."area/"]
purpose = "Long-lived areas of responsibility, ownership, or interest."
notes = "Areas require maintenance but do not have a fixed completion date. If it can be finished, it is a project or a task."
use_for = [
  "long-term responsibilities",
  "hobbies",
]
not_for = [
  "storing referential materials",
  "projects or tasks",
]
see_also = ["prj/", "task/"]

[paths."area/".group]
lifecycle = "ongoing"
origin = ["external", "self"]

[paths."area/3dp/"]
purpose = "3D printing hobby and its associated files."
notes = ""
use_for = [
  "printable models and print-related records",
  "3D printing activity and results",
]
not_for = [
  "active design projects",
  "general 3D printing knowledge",
]
see_also = ["prj/", "knwl/"]

[paths."area/3dp/".group]
lifecycle = "ongoing"
origin = ["self", "external", "generated"]

[paths."area/fin/"]
purpose = "Personal financial administration."
notes = ""
use_for = [
  "bank documents",
  "investment documents",
  "tax documents",
  "payslips",
  "invoices",
]
not_for = [
  "shopping",
]
see_also = ["area/paper/"]

[paths."area/fin/".group]
lifecycle = "ongoing"
origin = ["self", "external"]

[[paths."area/fin/".rules.file-extensions-v1]]
reason = "financial records must stay documents; anything else here arrived by accident"

[paths."area/fin/".rules.file-extensions-v1.params]
