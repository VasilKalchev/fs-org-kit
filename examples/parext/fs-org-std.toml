[paths."ws/lib/".group]
lifecycle = "ongoing"
origin = ["self", "external"]

[paths."ws/tmpl/"]
purpose = "Reusable starting points."
notes = ""
use_for = [
  "project templates",
  "configuration templates",
]
not_for = [
  "projects",
  "directly usable files",
]
see_also = ["prj/"]

[paths."ws/tmpl/".group]
lifecycle = "ongoing"
origin = ["self", "external"]

[paths."ws/tool/"]
purpose = "Tools that support projects."
notes = ""
use_for = [
  "development utilities",
  "helper programs",
  "CLI tools",
]
not_for = [
  "general applications",
]
see_also = ["sys/prog/"]

[paths."ws/tool/".group]
lifecycle = "ongoing"
origin = ["self", "external"]

[[paths.cross]]
paths = ["knwl/", "res/"]

[[paths.cross.rules.basename-sync-v1]]
reason = "source material that has been completely distilled must be removed; a name in both halves means it wasn't"

[paths.cross.rules.basename-sync-v1.params]
mode = "exclusive"
recursive = true




# =====================================================================
#  FOLDERS
# =====================================================================
[folders]

# What a [folders.reserved."..."] entry may carry - the same two
# declarations as paths.
[folders.attributes]
names = ["purpose", "notes", "use_for", "not_for", "see_also"]
required = ["purpose"]

[folders.attributes.group]
names = ["lifecycle", "origin"]
multi = ["origin"]
required = ["lifecycle", "origin"]


# ---------------------------------------------------------------------
#  Blanket rules  -  one invocation on root; each rule recurses itself
# ---------------------------------------------------------------------

# A `_`-prefixed folder announces that it means something particular
# wherever it appears. One that isn't in [folders.reserved] below is
# borrowing that authority without declaring what it means - which is
# how a second, undocumented convention starts.
[[folders.rules.uncataloged-reserved-v1]]
reason = "a folder that looks reserved but isn't documented is an undeclared convention spreading through the tree"

[folders.rules.uncataloged-reserved-v1.params]
cataloged = { ref = "folders.reserved" }
recursive = true
exclude = { ref = "globs.tool_dirs" }

# Characters Windows and exFAT forbid in a name. Every machine here is
# Unix-like, which is exactly why this is worth checking: the name that
# breaks is the one written today and copied to a FAT-formatted drive
# in two years, when there is no longer any obvious reason for it.
[[folders.rules.naming-pattern-v1]]
reason = "a name that can't survive a copy to a FAT-formatted drive fails silently, years after it was written"

[folders.rules.naming-pattern-v1.params]
pattern = '[<>:"|?*\\]'
mode = "disallow"
target = "both"
recursive = true
exclude = { ref = "globs.tool_dirs" }

# Folder names are this standard's own vocabulary - they are what the
# path keys above are made of. A word that is neither correctly spelled
# nor a declared abbreviation is a private shorthand, and the next one
# will disagree with it. Files are deliberately not checked: their names
# are content, arriving from outside and not this standard's to dictate.
[[folders.rules.spelling-abbreviations-v1]]
reason = "folder names are the standard's vocabulary; an undeclared shorthand today is an inconsistent one next year"

[folders.rules.spelling-abbreviations-v1.params]
abbreviations = { ref = "abbreviations" }
ignore = ["inbox"]      # a real word, absent from the `en` dictionary
target = "folders"
recursive = true
exclude = { ref = "globs.tool_dirs" }


# ---------------------------------------------------------------------
#  Reserved folder names
# ---------------------------------------------------------------------
# Names that mean the same thing wherever they appear in the tree. The
# `_` prefix is what marks a folder as structural rather than content,
# and is what the blanket uncataloged-reserved-v1 rule above looks for.
# Rules attached here run once per folder actually carrying the name,
# anywhere under root - so `_util` is checked in every folder that has
# one, without any of them being cataloged as a path.
[folders.reserved]
prefix = "_"


# --- _arch -----------------------------------------------------------
[folders.reserved."_arch"]
purpose = "Archive of inactive information/containers."
notes = "Indicates that contents are no longer part of the active workflow. Exception to the principle of tagging state rather than moving things."
use_for = [
  "projects/tasks that are no longer active",
  "domains that are no longer maintained",
  "non-versioned but obsolete files",
]
not_for = [
  "general archival",
  "backups",
]
see_also = ["prj/_arch/", "task/_arch/", "strg/"]

[folders.reserved."_arch".group]
lifecycle = "archival"
origin = ["self", "external"]

[folders.reserved."_inbox"]
purpose = "Local landing zone for arrivals belonging to the parent directory."
notes = "The inline counterpart to inbox/: something arrived for this area specifically, but where it goes inside it hasn't been decided. Distinct from _unsorted, where the destination IS known and only the shelf isn't."
use_for = [
  "newly acquired files that clearly belong to this area",
  "downloads collected during one activity",
]
not_for = [
  "files whose area hasn't been decided at all",
  "files already known to belong somewhere specific here",
]
see_also = ["inbox/", "_unsorted"]

[folders.reserved."_inbox".group]
lifecycle = "transient"
origin = ["external"]

[[folders.reserved."_inbox".rules.empty-v1]]
reason = "a zero-byte file here is a failed transfer, not something waiting to be filed"

[folders.reserved."_inbox".rules.empty-v1.params]
check_folders = false


# --- _unsorted -------------------------------------------------------
[folders.reserved."_unsorted"]
purpose = "Local unsorted files."
notes = "Files that belong under the parent directory but need additional classification. Unlike _inbox, the destination is already known - only the shelf isn't."
use_for = [
  "files awaiting classification",
  "transient holding area during organization",
  "files returned from original organization",
]
not_for = [
  "general transient files",
  "long-term storage",
  "archived information",
]
see_also = ["inbox/", "tmp/"]

[folders.reserved."_unsorted".group]
lifecycle = "transient"
origin = ["self", "external"]

[folders.reserved."_util"]
purpose = "Frequently used utilities related to the parent directory."
notes = "Contains links to utilities that are commonly used with the parent directory."
use_for = [
  "links to applications",
  "scripts",
  "directory-specific workflows",
]
not_for = [
  "general applications",
  "general scripts",
  "installers",
]
see_also = ["sys/scr/", "sys/prog/", "ws/tool/"]

[folders.reserved."_util".group]
lifecycle = "ongoing"
origin = ["self", "external"]

[[folders.reserved."_util".rules.link-integrity-v1]]
reason = "a shortcut to a utility outlives the utility, and nothing about the folder looks wrong when it does"

[folders.reserved."_util".rules.link-integrity-v1.params]
recursive = true




# =====================================================================
#  ENUMS
# =====================================================================
[enums]
# Closed value sets, one per field that has one, named for the KIND of
# field rather than the namespace - paths and reserved folders share them.

# A rule's own `severity` and `scope` enums are NOT here - they are
# the tool's own, and live in fs_org_kit/discovery.py.

[enums.group.lifecycle]
transient = "meant to be emptied constantly, nothing lingers"
temporary = "has a completion condition, then gets archived"
ongoing = "continuously active/maintained, no end state"
archival = "already at rest, rarely touched"

[enums.group.origin]
self = "authored directly by you - nothing to re-fetch or resync from elsewhere"
external = "sourced from outside this system - downloaded, received, or otherwise not authored by you"
generated = "produced automatically by a tool, script, or model - not hand-authored, not fetched externally"




# =====================================================================
#  TAGS
# =====================================================================
# Vocabularies for metadata carried by things on disk. Declared here,
# handed to a checking rule as one param with { ref = "tags.<name>" };
# nothing attaches a tag to a path directly. No rule points at `state`
# yet - the vocabulary is declared first so that when one does, it
# isn't retyped at the attachment site.
[tags]

[tags.state]
description = "Where a unit of work stands once it has left the active tree - the four cases prj/_arch/ and task/_arch/ already describe in prose."
multi = false

[tags.state.values]
abandoned = "stopped deliberately, will not be resumed"
complete = "finished, nothing further planned"
obsolete = "superseded by something else, kept only for reference"
paused = "intended to resume, blocked or set aside for now"




