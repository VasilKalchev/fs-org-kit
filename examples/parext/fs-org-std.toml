[paths."area/rc/".group]
lifecycle = "ongoing"
origin = ["self"]

[paths."area/std/"]
purpose = "Personal standards and conventions."
notes = "This file's own home."
use_for = [
  "infrastructure conventions",
  "naming conventions",
  "workflow standards",
  "filesystem organization standards",
]
not_for = [
  "configuration files",
  "transient notes",
  "documentation",
]
see_also = ["sys/scr/", "area/infra/"]

[paths."area/std/".group]
lifecycle = "ongoing"
origin = ["self"]

[paths."inbox/"]
purpose = "Temporary location for files that have not yet been classified."
notes = "Files must eventually be moved to their final location, deleted, transformed into knowledge, or archived."
use_for = [
  "newly acquired files",
]
not_for = [
  "permanent files",
]
see_also = ["tmp/", "_inbox", "_unsorted"]

[paths."inbox/".group]
lifecycle = "transient"
origin = ["external"]

[[paths."inbox/".rules.empty-v1]]
reason = "a zero-byte file here is a failed transfer, not something waiting to be filed"

[paths."inbox/".rules.empty-v1.params]
check_folders = false

# The inbox's whole contract is that nothing stays. An arrival still
# sitting here a month later is not awaiting classification, it is
# avoiding it - so it moves down into _unsorted/, which says the same
# thing without pretending the inbox is empty.
# `destination` is relative to the scanned path's PARENT, so this
# resolves to inbox/_unsorted/.
[[paths."inbox/".rules.staleness-v1]]
reason = "an arrival that survives a month in the inbox is being avoided, not triaged"

[paths."inbox/".rules.staleness-v1.params]
mode = "stale"
threshold = "1m"
destination = "inbox/_unsorted"
create_destination = true
exclude = ["_*", ".*"]


# ---------------------------------------------------------------------
#  knwl/  -  what has been understood, in your own words
# ---------------------------------------------------------------------
[paths."knwl/"]
purpose = "Personal distilled knowledge."
notes = "Used with Obsidian. A completed note must not exist simultaneously with its source in res/ - enforced by the cross-path rule at the end of this section."
use_for = [
  "self-written notes",
  "distilled references",
  "personal cheat sheets",
  "processed external information",
]
not_for = [
  "raw downloaded references",
  "manuals",
  "unprocessed documents",
]
see_also = ["res/", "area/lrn/"]

[paths."knwl/".group]
lifecycle = "ongoing"
origin = ["self"]

[paths."media/"]
purpose = "Entertainment media."
notes = ""
use_for = [
  "leisure books",
  "downloaded videos",
  "pictures and wallpapers",
  "personal photos",
]
not_for = [
  "technical literature",
  "video courses",
]
see_also = ["res/"]

[paths."media/".group]
lifecycle = "ongoing"
origin = ["self", "external"]

[paths."media/book/"]
purpose = "Books intended for leisure reading."
notes = "Separated by genre."
use_for = [
  "fiction",
  "popular science",
  "philosophy",
  "biographies",
]
not_for = [
  "technical references",
  "manuals",
  "datasheets",
]
see_also = ["res/"]

[paths."media/book/".group]
lifecycle = "ongoing"
origin = ["external"]

[paths."media/cam/"]
purpose = "Personal photos and video."
notes = "Separated by year and optionally date."
use_for = [
  "personal photography",
  "personal videography",
]
not_for = [
  "project photos",
  "inventory photos",
]
see_also = ["area/inv/item/"]

[paths."media/cam/".group]
lifecycle = "ongoing"
origin = ["self", "external"]

[[paths."media/cam/".rules.timestamp-consistency-v1]]
reason = "a photo filed under a date that contradicts its own name is lost, not misfiled"

[paths."media/cam/".rules.timestamp-consistency-v1.params]
recursive = true

# ...and consistent dates are only sortable if they are written the same
# way. A name with no leading timestamp at all is left alone; only one
# that clearly attempted a date in some other shape is reported.
[[paths."media/cam/".rules.timestamp-format-v1]]
reason = "mixed date spellings in one tree break every sort and every range query over it"

[paths."media/cam/".rules.timestamp-format-v1.params]
formats = ["%Y-%m-%d", "%Y%m%d_%H%M%S"]
target = "both"

# Re-importing a card that was already imported is the normal way this
# tree grows a second copy of everything.
[[paths."media/cam/".rules.duplicate-files-v1]]
reason = "a re-imported card silently doubles the library; only content hashing finds it"

[paths."media/cam/".rules.duplicate-files-v1.params]
recursive = true
min_size = 65536        # bytes, not a size string - skips thumbnails and sidecars


