notes = "A holding pen, not a destination: anything identified here moves to where it belongs."
use_for = [
  "unknown encryption keys",
  "unknown binaries",
]
not_for = [
  "files with known purpose",
]
see_also = ["inbox/"]

[paths."strg/unk/".group]
lifecycle = "archival"
origin = ["external", "generated"]

[paths."sys/"]
purpose = "Files consumed by this system and specific to it."
notes = ""
use_for = [
  "machine specific scripts",
  "virtual machines",
  "portable programs",
  "virtual views",
]
not_for = [
  "project dependencies",
  "documentation",
]
see_also = ["area/infra/", "ws/"]

[paths."sys/".group]
lifecycle = "ongoing"
origin = ["self", "external"]

[paths."sys/lnk/"]
purpose = "Curated navigation spaces."
notes = "Nothing is stored here; every leaf points somewhere else. The two rules below apply to the whole subtree, so cur/, nav/ and os/ declare none of their own."
use_for = [
  "navigation links",
  "custom views of the filesystem",
]
not_for = [
  "canonical file storage",
  "machine-specific files unrelated to navigation",
]
see_also = ["sys/lnk/cur/", "sys/lnk/nav/", "sys/lnk/os/"]

[paths."sys/lnk/".group]
lifecycle = "ongoing"
origin = ["self"]

[[paths."sys/lnk/".rules.link-policy-v1]]
reason = "a real file in a navigation view is a file that exists only here, where nothing looks for it"

[paths."sys/lnk/".rules.link-policy-v1.params]
files = "forbidden"
folders = "allowed"
links = "required"
recursive = true
exclude = [".*", "*/.*"]        # tool metadata (.directory, ...) isn't content

# A navigation space is worth exactly as much as its links resolve. This
# says nothing about whether the arrangement is right, only whether it
# still points at anything - the two rules are meant to run together.
[[paths."sys/lnk/".rules.link-integrity-v1]]
reason = "a dangling entry in a navigation space is worse than a missing one - it looks navigable"

[paths."sys/lnk/".rules.link-integrity-v1.params]
recursive = true
follow_chains = true


